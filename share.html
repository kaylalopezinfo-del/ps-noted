<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P.S. Noted — Shared Collection</title>
  <meta name="description" content="Someone shared a P.S. Noted collection with you." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7C6AF7; --teal: #22C9A0; --bg: #0F1B2D;
      --bg2: #1a2a3d; --text: #F5F4F0; --muted: rgba(255,255,255,0.5);
      --faint: rgba(255,255,255,0.08);
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav {
      max-width: 680px; margin: 0 auto; padding: 20px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: baseline; gap: 4px; text-decoration: none; }
    .logo-ps { font-size: 10px; font-weight: 800; color: var(--purple); letter-spacing: 0.12em; text-transform: uppercase; }
    .logo-noted { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
    .get-btn { background: var(--purple); color: #fff; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 7px; text-decoration: none; transition: background 0.15s; }
    .get-btn:hover { background: #6B59E8; }

    main { max-width: 680px; margin: 0 auto; padding: 20px 20px 60px; }

    .collection-header {
      background: rgba(255,255,255,0.03); border: 1px solid var(--faint);
      border-radius: 14px; padding: 24px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .collection-icon {
      width: 56px; height: 56px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
    }
    .collection-info { flex: 1; min-width: 0; }
    .collection-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .collection-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .collection-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .ctag { background: rgba(255,255,255,0.07); border: 1px solid var(--faint); color: var(--muted); font-size: 11px; padding: 2px 9px; border-radius: 20px; }

    .import-banner {
      background: rgba(124,106,247,0.08); border: 1px solid rgba(124,106,247,0.25);
      border-radius: 10px; padding: 14px 18px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .import-banner-text { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.5; }
    .import-banner-text strong { color: #A99BF8; }
    .import-btn {
      background: var(--purple); color: #fff; font-size: 13px; font-weight: 600;
      padding: 9px 18px; border-radius: 7px; border: none; cursor: pointer;
      white-space: nowrap; transition: background 0.15s; text-decoration: none;
      display: inline-block;
    }
    .import-btn:hover { background: #6B59E8; }

    .mobile-note {
      background: rgba(245,166,35,0.07); border: 1px solid rgba(245,166,35,0.2);
      border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
      font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5; display: none;
    }
    .mobile-note a { color: #F5A623; }

    .items-list { display: flex; flex-direction: column; gap: 10px; }

    .item-card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--faint);
      border-radius: 10px; overflow: hidden; display: flex;
    }
    .item-bar { width: 3px; flex-shrink: 0; }
    .item-body { padding: 12px 14px; flex: 1; min-width: 0; }
    .item-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .item-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
      letter-spacing: 0.04em;
    }
    .badge-highlight { background: rgba(124,106,247,0.15); color: #A99BF8; }
    .badge-prompt { background: rgba(34,201,160,0.15); color: #22C9A0; }
    .item-platform { font-size: 10px; color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
    .item-label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); }
    .item-text { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.55; margin-bottom: 8px; word-break: break-word; }
    .item-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .item-tag { background: rgba(124,106,247,0.1); border: 1px solid rgba(124,106,247,0.2); color: #A99BF8; font-size: 10px; padding: 1px 7px; border-radius: 20px; }
    .item-copy {
      background: none; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.35);
      font-size: 11px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .item-copy:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
    .error { text-align: center; padding: 60px 20px; }
    .error h2 { font-size: 20px; margin-bottom: 10px; }
    .error p { color: var(--muted); font-size: 14px; }

    footer {
      max-width: 680px; margin: 0 auto; padding: 20px;
      border-top: 1px solid var(--faint); text-align: center;
      font-size: 12px; color: rgba(255,255,255,0.2);
    }
    footer a { color: var(--purple); text-decoration: none; }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">
      <span class="logo-ps">P.S.</span>
      <span class="logo-noted">Noted</span>
    </a>
    <a class="get-btn" href="https://chromewebstore.google.com" target="_blank">Get the Extension</a>
  </nav>

  <main id="main">
    <div class="empty">Loading shared collection...</div>
  </main>

  <footer>
    <a href="index.html">P.S. Noted</a> — Save the good stuff.
  </footer>

  <script>
    const SHARE_BASE = 'https://yourusername.github.io/ps-noted/share.html';
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    function render() {
      const hash = location.hash;
      if (!hash || !hash.startsWith('#data=')) {
        document.getElementById('main').innerHTML = `
          <div class="error">
            <h2>No collection found</h2>
            <p>This share link doesn't contain any data. Ask the sender to reshare.</p>
          </div>`;
        return;
      }

      let data;
      try {
        const encoded = hash.slice(6);
        data = JSON.parse(decodeURIComponent(escape(atob(encoded))));
      } catch(e) {
        document.getElementById('main').innerHTML = `
          <div class="error">
            <h2>Invalid share link</h2>
            <p>This link appears to be corrupted. Ask the sender to reshare.</p>
          </div>`;
        return;
      }

      const items = data.items || [];
      const tags = data.tags || [];
      const sharedDate = data.sharedAt ? new Date(data.sharedAt).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '';

      document.title = `${data.emoji || ''} ${data.name} — P.S. Noted`;

      let html = `
        <div class="collection-header">
          <div class="collection-icon" style="background:${data.color || '#7C6AF7'}22; border: 1px solid ${data.color || '#7C6AF7'}44">
            ${data.emoji || (data.type === 'box' ? '📦' : '📁')}
          </div>
          <div class="collection-info">
            <div class="collection-name">${data.name}</div>
            <div class="collection-meta">${items.length} item${items.length !== 1 ? 's' : ''} · ${data.type || 'collection'}${sharedDate ? ` · Shared ${sharedDate}` : ''}</div>
            ${tags.length ? `<div class="collection-tags">${tags.map(t => `<span class="ctag">${t}</span>`).join('')}</div>` : ''}
          </div>
        </div>`;

      if (isMobile) {
        html += `<div class="mobile-note" style="display:block">
          📱 P.S. Noted is a Chrome desktop extension — you can't import this on mobile, but you can browse and copy any item below. <a href="index.html">Learn more →</a>
        </div>`;
      } else {
        html += `<div class="import-banner">
          <div class="import-banner-text">
            <strong>Have P.S. Noted?</strong> Import this ${data.type || 'collection'} directly into your shelf.
          </div>
          <button class="import-btn" id="import-btn">Import into P.S. Noted</button>
        </div>`;
      }

      if (!items.length) {
        html += `<div class="empty">This collection is empty.</div>`;
      } else {
        html += `<div class="items-list">` + items.map((item, i) => `
          <div class="item-card">
            <div class="item-bar" style="background:${data.color || '#7C6AF7'}"></div>
            <div class="item-body">
              <div class="item-meta">
                <span class="item-badge ${item.type === 'prompt' ? 'badge-prompt' : 'badge-highlight'}">${item.type === 'prompt' ? '⌨ Prompt' : '✦ Highlight'}</span>
                ${item.platform ? `<span class="item-platform">${item.platform}</span>` : ''}
                ${item.label ? `<span class="item-label">${item.label}</span>` : ''}
              </div>
              <div class="item-text">${item.text}</div>
              ${(item.tags||[]).length ? `<div class="item-tags">${item.tags.map(t=>`<span class="item-tag">${t}</span>`).join('')}</div>` : ''}
              <button class="item-copy" data-index="${i}">Copy</button>
            </div>
          </div>`).join('') + `</div>`;
      }

      document.getElementById('main').innerHTML = html;

      // Bind copy buttons
      document.querySelectorAll('.item-copy').forEach(btn => {
        btn.onclick = () => {
          const item = items[parseInt(btn.dataset.index)];
          navigator.clipboard.writeText(item.text).then(() => {
            btn.textContent = 'Copied ✓';
            setTimeout(() => btn.textContent = 'Copy', 1500);
          });
        };
      });

      // Import button — passes data to extension via URL scheme
      const importBtn = document.getElementById('import-btn');
      if (importBtn) {
        importBtn.onclick = () => {
          // Store in sessionStorage for extension to pick up
          sessionStorage.setItem('psNotedImport', JSON.stringify(data));
          importBtn.textContent = 'Opening P.S. Noted...';
          importBtn.style.background = '#22C9A0';
          showImportInstructions();
        };
      }
    }

    function showImportInstructions() {
      const banner = document.querySelector('.import-banner');
      if (!banner) return;
      banner.innerHTML = `
        <div class="import-banner-text">
          <strong>Almost there!</strong> Open P.S. Noted from your Chrome toolbar, go to Settings ⚙, and click <strong>"Import from link"</strong> to complete the import.
        </div>`;
    }

    render();
  </script>
</body>
</html>
